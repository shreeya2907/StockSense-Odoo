services:
  # StockSense Backend Web Service
  - type: web
    name: stocksense-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false


  # StockSense Frontend Static Site
  - type: static
    name: stocksense-web
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://stocksense-api.onrender.com/api

databases:
  # Free PostgreSQL Database Instance on Render
  - name: stocksense-db
    plan: free
    databaseName: stocksense
    user: stocksense_user
